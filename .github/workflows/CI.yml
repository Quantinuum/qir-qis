name: CI
on:
  repository_dispatch:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "DEVELOPMENT.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "qtm-qir-reference.md"
      - ".github/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  LLVM_RUST_CACHE_FAMILY: "llvm21"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nextest_extra_args: ""
          - os: windows-latest
            nextest_extra_args: "--test-threads=1"
          - os: macos-latest
            nextest_extra_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install hugrenv LLVM
        uses: Quantinuum/hugrverse-env/install-hugrenv-action@v1.0.0
        with:
          packages: "llvm"
      - name: Configure linker flags for test
        if: runner.os == 'Linux'
        run: |
          llvm_root="${LLVM_SYS_211_PREFIX}"
          echo "LLVM_CONFIG_PATH=${llvm_root}/bin/llvm-config" >>"$GITHUB_ENV"
          echo "CC=${llvm_root}/bin/clang" >>"$GITHUB_ENV"
          echo "CXX=${llvm_root}/bin/clang++" >>"$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=${llvm_root}/bin/clang" >>"$GITHUB_ENV"
          echo "RUSTFLAGS=-D warnings -C link-arg=-fuse-ld=lld" >>"$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ runner.os }}-${{ env.LLVM_RUST_CACHE_FAMILY }}
          cache-on-failure: true
          cache-workspace-crates: true
          cache-targets: true
          save-if: "false"
      - name: Test (Windows suite)
        if: runner.os == 'Windows'
        run: cargo nextest run --lib --all-features --test-threads=1 -E "not test(test_get_entry_attributes)"
      - name: Test (Windows isolated get_entry_attributes)
        if: runner.os == 'Windows'
        run: cargo test --lib --all-features test_get_entry_attributes -- --test-threads=1
      - name: Test
        if: runner.os != 'Windows'
        # All exercised tests live in the library test binary. Avoid rebuilding
        # empty bin/example harnesses, which is especially expensive with LLVM 21.
        run: cargo nextest run --lib --all-features ${{ matrix.nextest_extra_args }}
      - name: Test critical release behavior
        if: runner.os == 'Linux'
        run: >-
          cargo nextest run --release --lib --all-features
          -E 'test(/test_(qir2_base_fixture_validate_and_compile|qir_to_qis_output_parses_with_raw_llvm_buffer)$/)'
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Rust API example smoke
        if: runner.os != 'Linux'
        run: cargo run --example rust_api --all-features --profile test
      - name: Python API example smoke
        if: runner.os != 'Linux'
        run: uv run examples/python_api.py
      - name: Python main.py regression smoke
        run: uv run -- python tests/test_main.py

  lint:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect stub-affecting changes
        id: stub_changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            lib_rs:
              - 'src/lib.rs'
      - name: Install hugrenv LLVM
        uses: Quantinuum/hugrverse-env/install-hugrenv-action@v1.0.0
        with:
          packages: "llvm"
      - name: Configure linker flags for lint
        run: |
          llvm_root="${LLVM_SYS_211_PREFIX}"
          echo "LLVM_CONFIG_PATH=${llvm_root}/bin/llvm-config" >>"$GITHUB_ENV"
          echo "CC=${llvm_root}/bin/clang" >>"$GITHUB_ENV"
          echo "CXX=${llvm_root}/bin/clang++" >>"$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=${llvm_root}/bin/clang" >>"$GITHUB_ENV"
          echo "RUSTFLAGS=-D warnings -C link-arg=-fuse-ld=lld" >>"$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@v1.21.1
      - name: Install lint tools
        # `cargo-binstall` may fall back to `cargo install` when GitHub API
        # rate limiting prevents fetching a prebuilt `sccache` release.
        # Do not configure `sccache` as the wrapper until it exists.
        env:
          RUSTC_WRAPPER: ""
        run: |
          cargo binstall --no-confirm --force sccache
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            cargo binstall --no-confirm --force cargo-msrv
          fi
      - name: Restore sccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-${{ runner.os }}-${{ env.LLVM_RUST_CACHE_FAMILY }}
          cache-on-failure: true
          cache-workspace-crates: true
          cache-targets: true
          save-if: "false"
      - name: Run pre-commit lint
        env:
          SKIP: no-commit-to-branch
        run: uvx prek run --all-files
      - name: Verify Python stubs are up to date
        if: github.event_name == 'pull_request' && steps.stub_changes.outputs.lib_rs == 'true'
        run: |
          make stubs
          git diff --exit-code -- qir_qis.pyi
      - name: Verify the MSRV
        if: github.event_name != 'pull_request'
        run: cargo msrv verify

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@v1.21.1
      - name: Install cargo-audit
        run: cargo binstall --no-confirm --force cargo-audit
      - name: Audit Rust dependencies
        run: make audit
