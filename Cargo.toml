[package]
name = "qir-qis"
version = "0.1.8"
authors = ["Kartik Singhal <kartik.singhal@quantinuum.com>"]
edition = "2024"
rust-version = "1.91"
description = "QIR to Quantinuum QIS (Quantum Instruction Set) compiler"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/quantinuum/qir-qis/"
homepage = "https://github.com/quantinuum/qir-qis"
documentation = "https://docs.rs/qir-qis"
keywords = ["qir", "quantum", "compiler", "qis", "quantinuum"]
categories = ["compilers", "science"]
default-run = "qir-qis"
include = [
    "/src/**/*",
    "/examples/**/*.rs",
    "/tests/**/*.ll",
    "/tests/**/*.snap",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[dependencies]
bpaf = { version = "0.9", features = ["derive"] }
env_logger = "0.11"
inkwell = { version = "0.9", default-features = false, features = [
    "llvm21-1",
    "target-x86",
    "target-aarch64",
] }
llvm-sys = "211.0.1"
log = "0.4"
pyo3 = { version = "0.28", features = [
    "abi3-py310",
    "anyhow",
], optional = true }
pyo3-stub-gen = { version = "0.22", optional = true, features = [
    "infer_signature",
], default-features = false }
rstest = "0.26"
wasmparser = { version = "0.248", optional = true }

[features]
default = ["python"]
python = ["pyo3", "pyo3-stub-gen"]
wasm = ["wasmparser"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
arithmetic_overflow = "deny"
unnecessary_transmutes = "deny"

[lints.clippy]
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
assertions_on_result_states = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
dbg_macro = "deny"
expect_used = "deny"
fallible_impl_from = "deny"
fn_params_excessive_bools = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
integer_division = "deny"
join_absolute_paths = "deny"
map_err_ignore = "deny"
must_use_candidate = "deny"
option_env_unwrap = "deny"
panic = "deny"
panic_in_result_fn = "deny"
panicking_unwrap = "deny"
serde_api_misuse = "deny"
string_slice = "deny"
todo = "deny"
transmute_ptr_to_ref = "deny"
transmute_undefined_repr = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
uninit_vec = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
proptest = "1"
tempfile = "3"
wasm-encoder = "0.248"
